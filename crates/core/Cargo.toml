[package]
name = "appimgr-core"
description = "Core library for appimgr: AppImage parsing, library database, desktop integration"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Test helpers that build fake AppImages in memory (used by tests in other crates).
fixtures = []

[dependencies]
backhand = "0.25.5"
hex = "0.4.3"
percent-encoding = "2.3.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
tempfile = "3.27.0"
