name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Read-only token: these jobs only build and test.
permissions:
  contents: read

jobs:
  # The library and the command line tool need no Qt.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p appofholding-core -p appofholding --all-targets -- -D warnings
      - run: cargo test --locked -p appofholding-core -p appofholding

  # The interface needs Qt 6 and Kirigami, which Arch packages as one set.
  gui:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm base-devel git rust cmake qt6-base qt6-declarative qt6-svg kirigami
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: The GUI must not depend on Qt's private API
        run: |
          cargo build --locked -p appofholding-gui
          if nm -D --undefined-only target/debug/appofholding-gui | grep Qt_6_PRIVATE_API; then
            echo "::error::appofholding-gui uses private Qt symbols (see crates/gui/build.rs)"; exit 1
          fi
      - name: QML lint
        run: /usr/lib/qt6/bin/qmllint crates/gui/qml/*.qml || true
