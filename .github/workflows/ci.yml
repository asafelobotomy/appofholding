name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Read-only token: these jobs only build and test.
permissions:
  contents: read

jobs:
  deny:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories

  # The library and the command line tool need no Qt.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p appofholding-core -p appofholding --all-targets -- -D warnings
      - run: cargo test --locked -p appofholding-core -p appofholding

  # The interface needs Qt 6 and Kirigami, which Arch packages as one set.
  gui:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm base-devel git rust cmake qt6-base qt6-declarative qt6-svg kirigami
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: The GUI must not depend on Qt's private API
        run: |
          cargo build --locked -p appofholding-gui
          if nm -D --undefined-only target/debug/appofholding-gui | grep Qt_6_PRIVATE_API; then
            echo "::error::appofholding-gui uses private Qt symbols (see crates/gui/build.rs)"; exit 1
          fi
      - name: QML lint
        run: /usr/lib/qt6/bin/qmllint crates/gui/qml/*.qml || true
