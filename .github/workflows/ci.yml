name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Read-only token: these jobs only build and test.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deny:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: check advisories

  # The library and the command line tool need no Qt.
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # uQ's kits (uq/native.toml) are the pinned releases, and the logged problem codes match uq/diag/appofholding.toml
      - run: scripts/check-uq-native.sh
      # Every source file is within 400 lines of code (uQ's uq-loc)
      - run: scripts/check-loc.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p appofholding-core -p appofholding --all-targets -- -D warnings
      - run: cargo test --locked -p appofholding-core -p appofholding

  # The interface needs Qt 6 and Kirigami, which Arch packages as one set.
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm base-devel git rust cmake qt6-base qt6-declarative qt6-svg kirigami
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: The GUI must not depend on Qt's private API
        run: |
          cargo build --locked -p appofholding-gui
          if nm -D --undefined-only target/debug/appofholding-gui | grep Qt_6_PRIVATE_API; then
            echo "::error::appofholding-gui uses private Qt symbols (see crates/gui/build.rs)"; exit 1
          fi
      - name: QML lint
        run: /usr/lib/qt6/bin/qmllint crates/gui/qml/*.qml || true

  # The uQ widget and Settings page (uq/): their QML tests with a fake uQ context, their Node
  # tests, and uqctl's own check of the uq/ folder.
  uq:
    name: uQ integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The uQ release whose `uqctl` checks the page (uq_api 3 is in every release since v0.3.0).
      UQ_TAG: v0.3.37
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Qt Quick and qmltestrunner
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qtquick \
            qml6-module-qtquick-layouts qml6-module-qtquick-controls qml6-module-qttest qml6-module-qtqml-workerscript \
            qml6-module-qtquick-window qml6-module-qtquick-templates
      - name: Widget
        run: QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -input tests/uq/tst_widget.qml
      - name: Settings page
        run: QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -import tests/uq/stub -input tests/uq/tst_page.qml
      - name: Page logic and manifest
        run: node --test 'tests/uq/*.test.mjs'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Cache uqctl
        id: uqctl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.uq
          key: uqctl-${{ env.UQ_TAG }}
      - name: Build uqctl
        if: steps.uqctl.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/asafelobotomy/uq --tag "$UQ_TAG" uqctl --root "$HOME/.uq"
      # `--no-programs` skips only the "program exists" check: appofholding isn't installed here.
      - name: uQ integration check
        run: ~/.uq/bin/uqctl integrations check --no-programs uq/
